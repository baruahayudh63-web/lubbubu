<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Quick Question ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffeef2 0%, #ffd6e0 50%, #fed7e2 100%);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating background hearts */
    .bg-heart {
      position: fixed;
      color: rgba(255, 105, 135, 0.28);
      font-size: 22px;
      user-select: none;
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 34px 24px;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(255, 77, 109, 0.18), 0 4px 12px rgba(0, 0, 0, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      max-width: 400px;
      width: 100%;
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .gif-container {
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gif-container img {
      width: 175px;
      height: 175px;
      max-width: 52vw;
      max-height: 52vw;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: #2b2b2b;
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .sweet-message {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ff3366;
      margin-top: 14px;
      line-height: 1.45;
      word-break: break-word;
      padding: 10px 14px;
      background: rgba(255, 240, 243, 0.85);
      border-radius: 14px;
      border: 1px dashed rgba(255, 77, 109, 0.4);
    }

    .button-group {
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      position: relative;
    }

    button {
      padding: 13px 30px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(255, 77, 109, 0.45);
      z-index: 5;
    }

    #yesBtn:active {
      transform: scale(0.96);
    }

    #noBtn {
      background-color: #f1f3f5;
      color: #495057;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
      z-index: 2;
    }

    #noBtn:active {
      background-color: #e2e6ea;
    }

    #wrongText {
      color: #e63946;
      font-weight: 700;
      margin-top: 16px;
      font-size: 0.96rem;
      min-height: 24px;
      padding: 0 8px;
      transition: opacity 0.2s ease;
    }

    .hidden {
      display: none !important;
    }

    /* Confetti canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Mobile screens adjustments */
    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 26px 18px;
        border-radius: 24px;
      }

      h1 {
        font-size: 1.45rem;
      }

      .sweet-message {
        font-size: 1.15rem;
        padding: 8px 10px;
      }

      button {
        padding: 12px 24px;
        font-size: 1rem;
      }

      .gif-container img {
        width: 155px;
        height: 155px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating animated background hearts -->
  <div id="heartsContainer"></div>

  <!-- Confetti canvas for victory celebration -->
  <canvas id="confettiCanvas"></canvas>

  <div class="card">
    <div id="questionScreen">
      <div class="gif-container">
        <img id="displayGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZhcXk5bmZ1OWZ0ejFudmxocnB3cndvOHAzZ2hpNHRjZTV3ZWVmMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute asking cat">
      </div>
      <h1 id="questionTitle">Do you love me? 🥺</h1>
      <div class="button-group">
        <button id="yesBtn">Yes! 💖</button>
        <button id="noBtn">No</button>
      </div>
      <div id="wrongText"></div>
    </div>

    <div id="successScreen" class="hidden">
      <div class="gif-container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHU4enN6cmtxcXJia2R6MWd6eGZvaXNqM2RhMmVodGF4enZoaWdtMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/T86i6yDyOYz7J6dPhf/giphy.gif" alt="Happy celebration">
      </div>
      <h1>I knew it! 🥰</h1>
      <p class="sweet-message">love u too my cutulu,bubulu,sweetu <span id="recipientName"></span> ❤️✨</p>
    </div>
  </div>

  <script>
    // Read dynamic recipient from URL query parameter (e.g. ?name=... or ?to=...) to protect PII in public source
    const urlParams = new URLSearchParams(window.location.search);
    const recipientParam = urlParams.get('to') || urlParams.get('name') || '';
    const recipientSpan = document.getElementById('recipientName');
    if (recipientSpan) {
      recipientSpan.textContent = recipientParam;
    }

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const wrongText = document.getElementById('wrongText');
    const questionScreen = document.getElementById('questionScreen');
    const successScreen = document.getElementById('successScreen');
    const heartsContainer = document.getElementById('heartsContainer');

    // Generate floating hearts background
    const heartSymbols = ['❤️', '💖', '💕', '✨', '🌸', '🧸'];
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDuration = `${6 + Math.random() * 6}s`;
      heart.style.animationDelay = `${Math.random() * 5}s`;
      heart.style.fontSize = `${16 + Math.random() * 16}px`;
      heartsContainer.appendChild(heart);
    }

    const wrongMessages = [
      "Wrong answer! Try again 🤨",
      "Nice try, hit the other button! ❌",
      "Error 404: 'No' does not compute 🤖",
      "Wrong answer! You know you do 💖",
      "I'll pretend I didn't see that... 👀",
      "Are you sure about that? 🥺",
      "Look at that big shiny 'Yes' button! 👉"
    ];

    let messageIndex = 0;
    let yesScale = 1;
    let noScale = 1;

    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      // Display wrong message with animation
      wrongText.style.animation = 'none';
      wrongText.offsetHeight; /* trigger reflow */
      wrongText.style.animation = 'shake 0.3s ease';
      wrongText.textContent = wrongMessages[messageIndex % wrongMessages.length];
      messageIndex++;

      // Grow Yes button, shrink No button slightly (with safe boundary for mobile screens)
      yesScale = Math.min(2.4, yesScale + 0.22);
      noScale = Math.max(0.55, noScale - 0.1);
      
      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform = `scale(${noScale})`;
    });

    yesBtn.addEventListener('click', () => {
      questionScreen.classList.add('hidden');
      successScreen.classList.remove('hidden');
      launchConfetti();
    });

    // Lightweight inline confetti celebration
    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffd166', '#06d6a0', '#118ab2', '#ff99c8'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 12,
          dy: (Math.random() - 0.5) * 14 - 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10 - 5,
          tiltAngle: 0,
          tiltAngleInc: Math.random() * 0.08 + 0.04,
          alpha: 1
        });
      }

      let animationFrame;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach((p) => {
          p.x += p.dx;
          p.y += p.dy;
          p.dy += 0.25; // gravity
          p.tiltAngle += p.tiltAngleInc;
          p.tilt = Math.sin(p.tiltAngle) * 12;
          p.alpha -= 0.007;

          if (p.alpha > 0) {
            activeParticles++;
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.r, p.r * 0.6, p.tilt * Math.PI / 180, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
          }
        });

        if (activeParticles > 0) {
          animationFrame = requestAnimationFrame(render);
        } else {
          cancelAnimationFrame(animationFrame);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      render();
    }

    // Handle screen resize
    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confettiCanvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });
  </script>

</body>
</html>
